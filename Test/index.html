<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d24">
  <title>Hai tháng duo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

  <!-- Nền: ánh sáng mờ, bầu trời sao, hạt nhiễu -->
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <!-- Thanh trạng thái kiểu game: ngày, tiến độ, tên màn -->
  <header class="hud" id="hud">
    <span class="px hud-day" aria-hidden="true">DAY <b id="hudDay">00</b></span>
    <span class="hud-bar" aria-hidden="true"><i id="hudFill"></i></span>
    <span class="hud-stage" id="hudStage" aria-hidden="true"></span>
    <button class="hud-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Bật hoặc tắt âm thanh">♪</button>
  </header>

  <!-- Màn mời vào phòng -->
  <section class="gate" id="gate" aria-labelledby="gateTitle">
    <div class="gate-card">
      <p class="px" id="gateKicker"></p>
      <h2 class="gate-title" id="gateTitle"></h2>
      <p class="gate-sub" id="gateSub"></p>
      <div class="gate-players" aria-hidden="true">
        <span class="av p1" id="avMe"></span>
        <span class="dash"></span>
        <span class="av p2" id="avHer"></span>
      </div>
      <button class="btn" id="startBtn" type="button">
        <span class="px">ACCEPT</span>
        <em id="startLabel"></em>
      </button>
    </div>
  </section>

  <main id="main">
    <section class="hero" id="hero" data-stage="hero"></section>
    <section class="chapter" id="story" data-stage="story"></section>
    <section class="chapter" id="games" data-stage="games"></section>
    <section class="chapter" id="chat" data-stage="chat"></section>
    <section class="chapter" id="patches" data-stage="patches"></section>
    <section class="chapter" id="ach" data-stage="ach"></section>
    <section class="chapter" id="stats" data-stage="stats"></section>
    <section class="chapter" id="coop" data-stage="coop"></section>
  </main>

  <footer class="foot" id="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#0b0d24;color:#ebe9f7;font-family:sans-serif;text-align:center;padding:2rem">Trang này cần bật JavaScript để hiển thị.</p></noscript>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
